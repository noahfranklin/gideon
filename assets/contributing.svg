<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="How to add a Gideon skill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1714"/><stop offset="1" stop-color="#28211b"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e07b2a"/><stop offset="1" stop-color="#e8b45c"/></linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e07b2a"/></marker>
  </defs>
  <style>.t{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.h{font-weight:700;fill:#f2e8d6}.d{fill:#8d7c63}.m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;fill:#c3b193}</style>
  <rect width="1000" height="250" rx="16" fill="url(#bg)" stroke="#3d322a"/>
  <text class="t h" x="36" y="42" font-size="20">Add a skill in 5 steps</text>
  <text class="t d" x="36" y="63" font-size="12">Keep the authorization gate and the offense → detect → fix triad · cite a standard · then validate.</text>
  <g>
    <rect x="36" y="92" width="168" height="96" rx="10" fill="#2a221c" stroke="#3d322a"/>
    <rect x="36" y="92" width="168" height="4" rx="2" fill="url(#acc)"/>
    <text class="t h" x="52" y="120" font-size="13">1 · Scaffold</text>
    <text class="t m" x="52" y="146" font-size="10.5">skills/&lt;name&gt;/</text>
    <text class="t m" x="52" y="162" font-size="10.5">  SKILL.md</text>
    <text class="t m" x="52" y="178" font-size="10.5">  references/</text>
    <rect x="228" y="92" width="168" height="96" rx="10" fill="#2a221c" stroke="#3d322a"/>
    <rect x="228" y="92" width="168" height="4" rx="2" fill="url(#acc)"/>
    <text class="t h" x="244" y="120" font-size="13">2 · Frontmatter</text>
    <text class="t m" x="244" y="146" font-size="10.5">name: &lt;name&gt;</text>
    <text class="t m" x="244" y="162" font-size="10.5">description:</text>
    <text class="t m" x="244" y="178" font-size="10.5">"Use when…"</text>
    <rect x="420" y="92" width="168" height="96" rx="10" fill="#2a221c" stroke="#b23b32"/>
    <text class="t h" x="436" y="120" font-size="13">3 · Body</text>
    <text class="t d" x="436" y="144" font-size="10.5">auth gate →</text>
    <text class="t d" x="436" y="160" font-size="10.5">methodology →</text>
    <text class="t d" x="436" y="176" font-size="10.5">test·detect·fix</text>
    <rect x="612" y="92" width="168" height="96" rx="10" fill="#2a221c" stroke="#3d322a"/>
    <rect x="612" y="92" width="168" height="4" rx="2" fill="url(#acc)"/>
    <text class="t h" x="628" y="120" font-size="13">4 · Validate</text>
    <text class="t m" x="628" y="150" font-size="10">python3 scripts/</text>
    <text class="t m" x="628" y="165" font-size="10">validate_skills.py</text>
    <rect x="804" y="92" width="160" height="96" rx="10" fill="#2a221c" stroke="#8a9a54"/>
    <text class="t h" x="820" y="120" font-size="13">5 · PR</text>
    <text class="t d" x="820" y="150" font-size="10.5">CI runs the</text>
    <text class="t d" x="820" y="166" font-size="10.5">same check</text>
  </g>
  <line x1="206" y1="140" x2="226" y2="140" stroke="#e07b2a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="398" y1="140" x2="418" y2="140" stroke="#e07b2a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="590" y1="140" x2="610" y2="140" stroke="#e07b2a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="782" y1="140" x2="802" y2="140" stroke="#e07b2a" stroke-width="2" marker-end="url(#ar)"/>
  <text class="t d" x="36" y="228" font-size="11">Full guide → CONTRIBUTING.md · catalog regenerates into skills.json</text>
</svg>
